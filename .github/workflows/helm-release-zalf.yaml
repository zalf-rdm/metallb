name: Helm Chart Release (ZALF)

on:
  push:
    branches:
      - "0.16.1-zalf.*"
    paths:
      - "charts/**"
      - ".github/workflows/helm-release-zalf.yaml"

permissions:
  contents: write
  pages: write

jobs:
  release-chart:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code origin gh-pages; then
            git checkout --orphan gh-pages
            git rm -rf .
            echo '# Helm Chart Repository' > README.md
            git add README.md
            git commit -m 'Initialize gh-pages'
            git push origin gh-pages
            git checkout -
          fi
          git fetch origin gh-pages

      - name: Set chart version from branch name
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Stamp chart version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/0\.0\.0/${VERSION}/g" charts/metallb/charts/crds/Chart.yaml
          sed -i -E "s/0\.0\.0/${VERSION}/g" charts/metallb/Chart.yaml
          sed -i -E "s/v0\.0\.0/v${VERSION}/g" charts/metallb/Chart.yaml

      - name: Add frr-k8s repo (chart dependency)
        run: helm repo add frrk8s https://metallb.github.io/frr-k8s

      - name: Update chart dependencies
        run: helm dependency update charts/metallb

      - name: Download chart-releaser
        run: |
          curl -sSLo cr.tar.gz \
            "https://github.com/helm/chart-releaser/releases/download/v1.7.0/chart-releaser_1.7.0_linux_amd64.tar.gz"
          tar -xzf cr.tar.gz
          rm cr.tar.gz

      - name: Package chart
        run: ./cr package charts/metallb

      - name: Upload chart to GitHub Releases
        run: |
          ./cr upload \
            --owner "${{ github.repository_owner }}" \
            --git-repo "$(basename ${{ github.repository }})" \
            --release-name-template "{{ .Name }}-chart-{{ .Version }}" \
            --skip-existing \
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Update Helm index on gh-pages
        run: |
          ./cr index \
            --owner "${{ github.repository_owner }}" \
            --git-repo "$(basename ${{ github.repository }})" \
            --index-path index.yaml \
            --release-name-template "{{ .Name }}-chart-{{ .Version }}" \
            --push
